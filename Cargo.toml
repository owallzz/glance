[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/owallzz/glance"
publish = false

[workspace.dependencies]
glance-proto = { path = "crates/glance-proto" }
glance-core = { path = "crates/glance-core" }
glance-net = { path = "crates/glance-net" }
glance-media = { path = "crates/glance-media" }
gpui-kit = "0.10"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

# Media code is too slow to test realistically unoptimized.
[profile.dev.package.glance-media]
opt-level = 2
