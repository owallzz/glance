[package]
name = "glance-media"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
fast_image_resize = "6"
flume = "0.11"
openh264 = "0.9"
openh264-sys2 = "=0.9.10"
opus = "0.4"
cpal = "0.18"
nnnoiseless = { version = "0.5", default-features = false }
aec-rs = "1"
rtrb = "0.3"
nokhwa = { version = "0.10", features = ["input-native"] }
anyhow.workspace = true
tracing = "0.1"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
scap = { package = "zed-scap", version = "=0.0.8-zed", default-features = false }

# zed-scap asks for windows-capture "1.3.6" (any 1.x), but it uses APIs
# from 1.4 and 1.5 changed Settings::new. 1.4.4 is the compatible release.
[target.'cfg(target_os = "macos")'.dependencies]
# Same version zed-scap uses, for system audio with screen shares.
screencapturekit = "=0.2.8"

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "=1.4.4"

# Linux: X11 via zed-scap; Wayland via our own portal + PipeWire code
# (zed-scap's Wayland path needs libspa 0.8, which doesn't build against
# current PipeWire).
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pipewire"] }
scap = { package = "zed-scap", version = "=0.0.8-zed", default-features = false, features = ["x11"] }
pipewire = { version = "0.10", features = ["v0_3_44"] }
ashpd = { version = "0.14", default-features = false, features = ["tokio", "screencast"] }
tokio = { version = "1", features = ["rt", "macros"] }
