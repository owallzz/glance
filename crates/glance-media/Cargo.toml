[package]
name = "glance-media"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
fast_image_resize = "6"
flume = "0.11"
openh264 = "0.9"
anyhow.workspace = true
tracing = "0.1"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
scap = { package = "zed-scap", version = "=0.0.8-zed", default-features = false }

# Linux: X11 via zed-scap; Wayland via our own portal + PipeWire code
# (zed-scap's Wayland path needs libspa 0.8, which doesn't build against
# current PipeWire).
[target.'cfg(target_os = "linux")'.dependencies]
scap = { package = "zed-scap", version = "=0.0.8-zed", default-features = false, features = ["x11"] }
pipewire = "0.10"
ashpd = { version = "0.14", default-features = false, features = ["tokio", "screencast"] }
tokio = { version = "1", features = ["rt", "macros"] }
