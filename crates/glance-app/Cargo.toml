[package]
name = "glance-app"
description = "Peer-to-peer screen sharing rooms"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "glance"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
anyhow.workspace = true
serde_json = "1"
image = { version = "0.25", default-features = false }
flume = "0.11"
glance-media.workspace = true
glance-core.workspace = true
glance-net.workspace = true
glance-proto.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
iroh = "1.5"
dirs = "6"
mime_guess = "2"
notify-rust = "4"
rand = "0.9"
serde = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing = "0.1"
bytes = "1"
png = "0.18"
auto-launch = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["tokio"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.26"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"
