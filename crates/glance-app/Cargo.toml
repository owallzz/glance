[package]
name = "glance-app"
description = "Peer-to-peer screen sharing rooms"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "glance"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
anyhow.workspace = true
serde_json = "1"
image = { version = "0.25", default-features = false }
flume = "0.11"
glance-media.workspace = true
glance-core.workspace = true
glance-net.workspace = true
glance-proto.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "time", "fs", "io-util"] }
iroh = "1.5"
dirs = "6"
mime_guess = "2"
notify-rust = "4"
rand = "0.9"
serde = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing = "0.1"
bytes = "1"
png = "0.18"
auto-launch = "0.6"
semver = "1"
minisign-verify = "0.2"
# Same HTTP stack iroh already pulls in (rustls with ring, no OpenSSL).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
minisign = "0.7"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false }
ksni = { version = "0.3", default-features = false, features = ["tokio"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
user-idle = { version = "0.6", default-features = false }
tray-icon = "0.26"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"

# Icon and version info in glance.exe (see build.rs).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
