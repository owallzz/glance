name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux: the owallzz self-hosted runner, in a Fedora container.
  check:
    name: Linux
    runs-on: [self-hosted, Linux, X64]
    # The runner has no C compiler/linker, so Rust builds run in a container.
    container: fedora:44
    timeout-minutes: 45
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False gcc gcc-c++ git curl pkgconf-pkg-config fontconfig-devel freetype-devel libxkbcommon-devel libxkbcommon-x11-devel libxcb-devel wayland-devel vulkan-loader-devel openssl-devel
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Container jobs run as root; hand the workspace back to the runner user so later jobs can clean it.
      - name: Fix workspace ownership
        if: always()
        run: chown -R "$(stat -c %u:%g "$GITHUB_WORKSPACE/..")" "$GITHUB_WORKSPACE"

  # macOS and Windows: Blacksmith runners (not the self-hosted one).
  # No containers here; the toolchain comes from rust-toolchain.toml.
  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runs-on: blacksmith-6vcpu-macos-latest
          - name: Windows
            runs-on: blacksmith-4vcpu-windows-2025
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # actions/cache (used by rust-cache) is backed by Blacksmith's cache.
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p glance-app
