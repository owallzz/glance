name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-dev libx11-xcb-dev libxrandr-dev libwayland-dev libvulkan-dev libssl-dev libpipewire-0.3-dev libclang-dev libdbus-1-dev libasound2-dev nasm
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The toolchain comes from rust-toolchain.toml.
  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runs-on: macos-latest
          - name: Windows
            runs-on: windows-latest
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Shows which platform encoder the codec tests ran with (or why not).
      - name: Platform encoder tests, verbose
        run: cargo test --workspace --locked -- media_foundation videotoolbox hardware_decoder --nocapture
      - run: cargo build --release --locked -p glance-app
      - name: macOS app bundle builds
        if: runner.os == 'macOS'
        shell: bash
        run: scripts/package-macos.sh target/release/glance 0.0.0 bundle
