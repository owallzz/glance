name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-dev libx11-xcb-dev libxrandr-dev libwayland-dev libvulkan-dev libssl-dev libpipewire-0.3-dev libclang-dev libdbus-1-dev libasound2-dev nasm
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="glance-app") | .version')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - run: cargo build --release --locked -p glance-app
      - name: Package
        run: |
          mkdir dist
          cp target/release/glance "dist/glance-${GITHUB_REF_NAME}-linux-x86_64"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux
          path: dist/*
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*

  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runs-on: macos-latest
            asset: macos-aarch64
          - name: Windows
            runs-on: windows-latest
            asset: windows-x86_64.exe
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="glance-app") | .version')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - run: cargo build --release --locked -p glance-app
      - name: Package
        run: |
          # Plain binaries, no archive: download and run.
          mkdir dist
          bin=target/release/glance
          [ "${{ matrix.name }}" = "Windows" ] && bin=target/release/glance.exe
          cp "$bin" "dist/glance-${GITHUB_REF_NAME}-${{ matrix.asset }}"
      - name: macOS app bundle (.dmg)
        if: matrix.name == 'macOS'
        run: |
          # The .app holds the permission prompts and glance:// handler.
          scripts/package-macos.sh target/release/glance "${GITHUB_REF_NAME#v}" bundle
          mv bundle/glance.dmg "dist/glance-${GITHUB_REF_NAME}-macos-aarch64.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
