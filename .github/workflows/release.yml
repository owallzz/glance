name: release
on:
  push:
    tags: ["v*"]
  # Test-builds every package without a tag: the files land as workflow
  # artifacts (named after the branch), nothing is uploaded to a release.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-dev libx11-xcb-dev libxrandr-dev libwayland-dev libvulkan-dev libssl-dev libpipewire-0.3-dev libclang-dev libdbus-1-dev libasound2-dev nasm file desktop-file-utils appstream
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="glance-app") | .version')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - run: cargo build --release --locked -p glance-app
      - name: Package
        run: |
          mkdir dist
          cp target/release/glance "dist/glance-${GITHUB_REF_NAME}-linux-x86_64"
      - name: AppImage
        env:
          # GitHub runners have no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          out="dist/glance-${GITHUB_REF_NAME}-linux-x86_64.AppImage"
          scripts/package-appimage.sh target/release/glance "$out"
          "$out" --version
      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux
          path: dist/*

  # flatpak-builder builds offline, so the crates come from a sources file
  # generated from Cargo.lock.
  flatpak-sources:
    name: Flatpak sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: scripts/flatpak-cargo-sources.sh packaging/flatpak/cargo-sources.json
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-cargo-sources
          path: packaging/flatpak/cargo-sources.json

  flatpak:
    name: Flatpak
    needs: flatpak-sources
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: flatpak-cargo-sources
          path: packaging/flatpak
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: glance-${{ github.ref_name }}-linux-x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.owallzz.glance.yml
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock') }}
          upload-artifact: false
      - name: Package
        run: |
          mkdir -p dist
          mv "glance-${GITHUB_REF_NAME}-linux-x86_64.flatpak" dist/
      - uses: actions/upload-artifact@v7
        with:
          name: dist-flatpak
          path: dist/*

  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runs-on: macos-latest
            asset: macos-aarch64
          - name: Windows
            runs-on: windows-latest
            asset: windows-x86_64.exe
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="glance-app") | .version')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - run: cargo build --release --locked -p glance-app
      - name: Package
        run: |
          # Plain binaries, no archive: download and run.
          mkdir dist
          bin=target/release/glance
          [ "${{ matrix.name }}" = "Windows" ] && bin=target/release/glance.exe
          cp "$bin" "dist/glance-${GITHUB_REF_NAME}-${{ matrix.asset }}"
          "$bin" --version
      - name: macOS app bundle (.dmg, .app.tar.gz)
        if: matrix.name == 'macOS'
        run: |
          # The .app holds the permission prompts and glance:// handler.
          scripts/package-macos.sh target/release/glance "${GITHUB_REF_NAME#v}" bundle
          mv bundle/glance.dmg "dist/glance-${GITHUB_REF_NAME}-macos-aarch64.dmg"
          # No AppleDouble (._*) files, which would break the signature.
          COPYFILE_DISABLE=1 tar -C bundle -czf "dist/glance-${GITHUB_REF_NAME}-macos-aarch64.app.tar.gz" glance.app
      - name: Windows installer and portable zip
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'glance-app').version
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          & $iscc "/DAppVersion=$version" "/DSourceExe=$PWD\target\release\glance.exe" `
            "/DOutputDir=$PWD\dist" "/DOutputName=glance-$tag-windows-x86_64-setup" `
            packaging\windows\glance.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Portable: glance.exe plus an empty `portable` marker, which keeps
          # the data in a `data` folder next to it.
          New-Item -ItemType Directory portable | Out-Null
          Copy-Item target\release\glance.exe portable\glance.exe
          New-Item -ItemType File portable\portable | Out-Null
          Push-Location portable
          7z a -tzip "..\dist\glance-$tag-windows-x86_64-portable.zip" glance.exe portable
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Pop-Location
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: dist/*

  # Signs every release asset with minisign (packaging/minisign.pub holds the
  # public key the updater checks against). The trusted comment names the
  # file, so a signature can't be reused for another version's asset.
  sign:
    name: Sign
    # Every job that uploads a dist-* artifact belongs here. Runs even when a
    # build leg failed, so the platforms that did build still get signatures
    # (an unsigned asset is never installed by the updater).
    needs: [release, flatpak, native]
    permissions:
      contents: write
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Sign assets
        id: sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "::error::MINISIGN_SECRET_KEY is not set; tagged releases must be signed"
              exit 1
            fi
            echo "::warning::MINISIGN_SECRET_KEY is not set; skipping signatures (test run)"
            exit 0
          fi
          mkdir -p dist
          if [ -z "$(ls -A dist)" ]; then
            echo "::warning::no build artifacts to sign"
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
          umask 077
          key="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          cd dist
          shopt -s nullglob
          for f in *; do
            case "$f" in *.minisig) continue ;; esac
            [ -f "$f" ] || continue
            minisign -S -s "$key" -m "$f" -x "$f.minisig" \
              -t "$(printf 'timestamp:%s\tfile:%s\thashed' "$(date +%s)" "$f")"
          done
          rm -f "$key"
          ls -l
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.sign.outputs.signed == 'true'
        with:
          name: signatures
          path: dist/*.minisig
      # The build jobs only make artifacts; the release gets every asset and
      # its signature here in one go, so the updater never sees a release
      # whose files aren't signed yet.
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') && steps.sign.outputs.signed == 'true'
        with:
          files: dist/*
