name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux: the owallzz self-hosted runner, in a Fedora container.
  release:
    name: Linux
    runs-on: [self-hosted, Linux, X64]
    container: fedora:44
    timeout-minutes: 60
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False gcc gcc-c++ git curl pkgconf-pkg-config fontconfig-devel freetype-devel libxkbcommon-devel libxkbcommon-x11-devel libxcb-devel wayland-devel vulkan-loader-devel openssl-devel jq tar
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="glance-app") | .version')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - run: cargo build --release --locked -p glance-app
      - name: Package
        run: |
          mkdir dist
          tar -czf "dist/glance-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" -C target/release glance
      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux
          path: dist/*
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
      # Container jobs run as root; hand the workspace back to the runner user so later jobs can clean it.
      - name: Fix workspace ownership
        if: always()
        run: chown -R "$(stat -c %u:%g "$GITHUB_WORKSPACE/..")" "$GITHUB_WORKSPACE"

  # macOS and Windows: Blacksmith runners.
  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runs-on: blacksmith-6vcpu-macos-latest
            archive: macos-aarch64.tar.gz
          - name: Windows
            runs-on: blacksmith-4vcpu-windows-2025
            archive: windows-x86_64.zip
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="glance-app") | .version')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - run: cargo build --release --locked -p glance-app
      - name: Package
        run: |
          mkdir dist
          name="glance-${GITHUB_REF_NAME}-${{ matrix.archive }}"
          if [ "${{ matrix.name }}" = "Windows" ]; then
            7z a "dist/$name" ./target/release/glance.exe
          else
            tar -czf "dist/$name" -C target/release glance
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
